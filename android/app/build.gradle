plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

def repositoryRoot = rootProject.projectDir.parentFile
def versionSource = new File(repositoryRoot, 'version.py').text
def appVersion = (versionSource =~ /APP_VERSION = "([^"]+)"/)[0][1]
def androidBeta = (versionSource =~ /ANDROID_BETA = (\d+)/)[0][1]
def androidVersionCode = (versionSource =~ /ANDROID_VERSION_CODE = (\d+)/)[0][1].toInteger()
def signingProperties = new Properties()
def signingFile = rootProject.file('keystore.properties')
if (signingFile.exists()) signingFile.withInputStream { signingProperties.load(it) }

android {
    namespace 'com.mygamelist'
    compileSdk 36
    defaultConfig {
        applicationId 'com.mygamelist'
        minSdk 24
        targetSdk 36
        versionCode androidVersionCode
        versionName "${appVersion}-android-beta.${androidBeta}"
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
    signingConfigs {
        if (signingFile.exists()) {
            release {
                storeFile rootProject.file(signingProperties['storeFile'])
                storePassword signingProperties['storePassword']
                keyAlias signingProperties['keyAlias']
                keyPassword signingProperties['keyPassword']
            }
        }
    }
    buildTypes {
        debug { applicationIdSuffix '.debug'; versionNameSuffix '-debug' }
        release {
            minifyEnabled false
            if (signingFile.exists()) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// An allowlist prevents databases, API tokens, desktop builds or Git history
// from being bundled when the shared Python application is assembled.
def sharedPython = layout.buildDirectory.dir('generated/sharedPython')
def stageSharedPython = tasks.register('stageSharedPython', Sync) {
    from(repositoryRoot) {
        include 'app.py', 'database.py', 'paths.py', 'game_client.py', 'translations.py', 'version.py', 'templates/**', 'static/**'
    }
    into sharedPython
}
chaquopy {
    defaultConfig {
        version '3.13'
        if (System.getenv('CHAQUOPY_BUILD_PYTHON')) buildPython System.getenv('CHAQUOPY_BUILD_PYTHON')
        pip { install '-r', new File(repositoryRoot, 'requirements.txt').absolutePath }
    }
    sourceSets {
        main { srcDir sharedPython }
    }
}
tasks.configureEach { task ->
    if ((task.name.startsWith('generate') || task.name.startsWith('merge')) && task.name.contains('Python')) {
        task.dependsOn stageSharedPython
    }
}
