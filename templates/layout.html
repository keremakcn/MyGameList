<!DOCTYPE html>
<html lang="{{ current_lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MyGameList{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <header class="navbar">
        <a href="{{ url_for('index') }}" class="navbar-brand">
            <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="2" y="8" width="24" height="14" rx="4" fill="var(--accent)"/>
                <circle cx="9" cy="15" r="2.2" fill="var(--bg)"/>
                <circle cx="19" cy="13" r="1.6" fill="var(--bg)"/>
                <circle cx="19.5" cy="17.5" r="1.6" fill="var(--bg)"/>
                <rect x="7.2" y="12.8" width="3.6" height="1.4" fill="var(--accent)"/>
                <rect x="8.3" y="11.7" width="1.4" height="3.6" fill="var(--accent)"/>
            </svg>
            <span>MYGAMELIST</span>
        </a>
        <nav class="navbar-links">
            <a href="{{ url_for('index') }}">{{ t('nav_home') }}</a>
            <a href="{{ url_for('setup') }}">{{ t('nav_settings') }}</a>
            <div class="lang-toggle">
                <a href="{{ url_for('set_language', lang='tr') }}" class="lang-option {% if current_lang == 'tr' %}lang-active{% endif %}">TR</a>
                <a href="{{ url_for('set_language', lang='en') }}" class="lang-option {% if current_lang == 'en' %}lang-active{% endif %}">EN</a>
            </div>
        </nav>
    </header>

    <main class="content">
        {% block content %}{% endblock %}
    </main>

    <div class="modal-overlay" id="confirm-modal">
        <div class="modal-box">
            <h3>{{ t('modal_delete_title') }}</h3>
            <p id="confirm-modal-text"></p>
            <div class="modal-actions">
                <button type="button" class="btn-secondary" id="confirm-modal-cancel">{{ t('modal_cancel') }}</button>
                <button type="button" class="btn-danger" id="confirm-modal-confirm">{{ t('modal_confirm') }}</button>
            </div>
        </div>
    </div>

    <script>
const confirmTextTemplate = {{ t('modal_delete_text')|tojson }};

        document.addEventListener('DOMContentLoaded', function () {
            const overlay = document.getElementById('confirm-modal');
            if (!overlay) return;

            const textEl = document.getElementById('confirm-modal-text');
            const confirmBtn = document.getElementById('confirm-modal-confirm');
            const cancelBtn = document.getElementById('confirm-modal-cancel');
            let pendingForm = null;

            document.querySelectorAll('.delete-form').forEach(function (form) {
                form.addEventListener('submit', function (e) {
                    e.preventDefault();
                    pendingForm = form;
                    const gameName = form.dataset.gameName || '';
                    textEl.textContent = confirmTextTemplate.replace('{name}', gameName);
                    overlay.classList.add('active');
                });
            });

            confirmBtn.addEventListener('click', function () {
                if (pendingForm) pendingForm.submit();
            });

            cancelBtn.addEventListener('click', function () {
                overlay.classList.remove('active');
                pendingForm = null;
            });

            overlay.addEventListener('click', function (e) {
                if (e.target === overlay) {
                    overlay.classList.remove('active');
                    pendingForm = null;
                }
            });
        });
    </script>

</body>
</html>
